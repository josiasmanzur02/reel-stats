<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.webmanifest" />
  <title>Add / Edit Catch</title>
  <link rel="stylesheet" href="./assets/css/styles.css">
</head>
<body>
  <header>
    <nav class="nav">
      <div class="brand">
        <img src="./assets/icons/icon-192.png" alt="logo">
        <span>Fish Catch Tracker</span>
      </div>
      <div class="nav-links">
        <a href="./index.html">Dashboard</a>
        <a href="./catch-form.html" class="active">Add Catch</a>
        <a href="./gallery.html">Gallery</a>
        <a href="./map.html">Map</a>
        <a href="./backup.html">Backup</a>
      </div>
    </nav>
  </header>

  <main>
    <div class="card">
      <h1 id="form-title">Add Catch</h1>
      <form id="catch-form" novalidate>
        <div class="inline">
          <div>
            <label for="species">Species *</label>
            <input id="species" name="species" required placeholder="Largemouth bass">
            <div class="error" data-error-for="species"></div>
          </div>
          <div>
            <label for="nickname">Nickname</label>
            <input id="nickname" name="nickname" placeholder="Optional">
          </div>
        </div>

        <div class="inline">
          <div>
            <label for="dateCaught">Date *</label>
            <input type="date" id="dateCaught" name="dateCaught" required>
            <div class="error" data-error-for="dateCaught"></div>
          </div>
          <div>
            <label for="locationName">Location *</label>
            <input id="locationName" name="locationName" required placeholder="Lake name or spot">
            <div class="error" data-error-for="locationName"></div>
          </div>
        </div>

        <div class="inline">
          <div>
            <label for="lat">Latitude *</label>
            <input type="number" step="0.0001" id="lat" name="lat" required placeholder="e.g., 38.8977">
            <div class="error" data-error-for="lat"></div>
          </div>
          <div>
            <label for="lng">Longitude *</label>
            <input type="number" step="0.0001" id="lng" name="lng" required placeholder="-77.0365">
            <div class="error" data-error-for="lng"></div>
          </div>
        </div>

        <div class="inline">
          <div>
            <label for="weight">Weight *</label>
            <div class="inline">
              <input type="number" step="0.01" id="weight" name="weight" required placeholder="4.8">
              <select id="weightUnit" name="weightUnit">
                <option value="lb">lb</option>
                <option value="kg">kg</option>
              </select>
            </div>
            <div class="error" data-error-for="weight"></div>
          </div>
          <div>
            <label for="length">Length *</label>
            <div class="inline">
              <input type="number" step="0.1" id="length" name="length" required placeholder="19.5">
              <select id="lengthUnit" name="lengthUnit">
                <option value="in">in</option>
                <option value="cm">cm</option>
              </select>
            </div>
            <div class="error" data-error-for="length"></div>
          </div>
        </div>

        <div>
          <label for="notes">Notes</label>
          <textarea id="notes" name="notes" placeholder="Conditions, lure, depth..."></textarea>
        </div>

        <div>
          <label for="photos">Photos</label>
          <input type="file" id="photos" accept="image/*" multiple>
          <div class="muted" style="margin-top:6px;">Images are resized locally (1600px full, 400px thumb) before saving.</div>
          <div id="photo-preview" class="chips" style="margin-top:10px;"></div>
        </div>

        <div class="btn-row">
          <button type="submit">Save Catch</button>
          <a class="btn secondary" href="./index.html">Cancel</a>
        </div>
      </form>
    </div>
  </main>

  <div id="toast" class="toast"></div>

  <script type="module" src="./assets/js/form.js"></script>
  <script type="module" src="./assets/js/sw-register.js"></script>
</body>
</html>
